{
    "#": "IVA Downloader reads this file automatically. Remove postprocessors to disable JSON metadata sidecars.",
    "extractor": {
        "twitter": {
            "#": "Download retweets/reposts and keep the original post metadata.",
            "retweets": "original",
            "#": "The filename format adds the original artist's handle.",
            "filename": "{author[name]}_{tweet_id}_{num}.{extension}"
        }
    },
    "postprocessors": ["metadata"]
}
