{
    "#": "Docs: https://github.com/mikf/gallery-dl/blob/master/docs/configuration.rst. Remove postprocessors to disable JSON files.",
    "extractor": {
        "#": "Retry count, request delay, skip existing files, and OS-safe filenames.",
        "retries": 4,
        "sleep-request": "1.0-2.0",
        "skip": true,
        "path-restrict": "auto",
        "twitter": {
            "#": "Downloads reposts, photos, and videos; skips GIFs and audio. Enable quoted or pinned to include those posts.",
            "retweets": "original",
            "filename": "{author[name]}_{tweet_id}_{num}.{extension}",
            "videos": true,
            "file-filter": ["type in ('photo', 'video')"],
            "quoted": false,
            "pinned": false,
            "retries-api": 9
        }
    },
    "postprocessors": ["metadata"]
}
